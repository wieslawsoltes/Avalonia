name: Materialize macOS theme source

on:
  push:
    branches: [feature/macos26-theme]
    paths:
      - 'eng/macos26/initialize.py'
      - 'eng/macos26/generate_*.py'
      - '.github/workflows/macos-theme-materialize.yml'

permissions:
  contents: read

jobs:
  materialize:
    if: github.repository == 'wieslawsoltes/Avalonia' && github.ref == 'refs/heads/feature/macos26-theme'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: materialize-macos-theme-source
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/macos26-theme
          fetch-depth: 0
      - name: Apply explicit source migrations and preserve incremental commits
        id: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 eng/macos26/initialize.py
          for generator in eng/macos26/generate_*.py; do
            test ! -f "$generator" || python3 "$generator"
          done
          git pull --rebase origin feature/macos26-theme
          git push origin HEAD:feature/macos26-theme
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validation:
    needs: materialize
    uses: ./.github/workflows/macos-theme.yml
    with:
      source_ref: ${{ needs.materialize.outputs.commit }}
    permissions:
      contents: read
