name: Integrate remaining metrics implementation
on:
  push:
    branches: ['perf/ferroui-runtime-optimizations']
    paths: ['scripts/performance/apply-metrics-step.py', '**/*.ferroui-pending', '.github/workflows/ferroui-integrate-metrics.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/Avalonia' && github.ref == 'refs/heads/perf/ferroui-runtime-optimizations'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Apply exact-source integration
        run: python3 scripts/performance/apply-metrics-step.py
      - name: Validate integrated source
        run: |
          dotnet run --project tests/Avalonia.Base.UnitTests -c Release -p:AvsSkipBuildingLegacyTargetFrameworks=True -- --report-trx --results-directory "$RUNNER_TEMP/metrics-base"
          dotnet run --project tests/Avalonia.Skia.UnitTests -c Release -p:AvsSkipBuildingLegacyTargetFrameworks=True -- --report-trx --results-directory "$RUNNER_TEMP/metrics-skia"
      - name: Commit on the same branch without rewriting concurrent work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests samples scripts/performance/apply-metrics-step.py .github/workflows/ferroui-integrate-metrics.yml
          git diff --cached --check
          git commit -m "perf(text): reuse default line metrics and adapt cache probing to unique-text scans"
          git push origin HEAD:refs/heads/perf/ferroui-runtime-optimizations
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ferroui-line-metrics-tests
          path: ${{ runner.temp }}/metrics-*
          retention-days: 7
