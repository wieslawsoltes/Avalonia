name: Prune superseded macOS theme validation
on:
  push:
    branches: [feature/macos26-theme]
    paths: ['.github/workflows/macos-theme-prune-temporary.yml']
permissions:
  contents: read
jobs:
  prune:
    if: github.repository == 'wieslawsoltes/Avalonia' && github.ref == 'refs/heads/feature/macos26-theme'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel only superseded runs created for this theme branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate 'repos/wieslawsoltes/Avalonia/actions/runs?branch=feature%2Fmacos26-theme&per_page=100' \
            --jq '.workflow_runs[] | select(.head_branch == "feature/macos26-theme" and .id <= 33990143546 and .status != "completed" and (.path == ".github/workflows/macos-theme-materialize.yml" or .path == ".github/workflows/macos-theme.yml")) | .id' \
            | while read -r id; do
                echo "Canceling superseded theme validation $id"
                gh api --method POST "repos/wieslawsoltes/Avalonia/actions/runs/$id/cancel" \
                  || echo "Run $id already completed or could not be canceled; no further action taken."
              done
