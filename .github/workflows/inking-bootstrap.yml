name: Inking development toolchain
on:
  push:
    branches: [feat/standalone-inking-system]
    paths: [.github/workflows/inking-bootstrap.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/inking-dotnet
      NUGET_PACKAGES: ${{ runner.temp }}/inking-nuget
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install WebAssembly toolchain and restore Avalonia dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet workload install wasm-tools --skip-manifest-update
          mkdir -p "$RUNNER_TEMP/inking-restore"
          cd "$RUNNER_TEMP/inking-restore"
          cat > Bootstrap.csproj <<'PROJECT'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFrameworks>net10.0;net10.0-browser</TargetFrameworks></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Avalonia" Version="12.1.4" />
              <PackageReference Include="Avalonia.Desktop" Version="12.1.4" />
              <PackageReference Include="Avalonia.Browser" Version="12.1.4" />
              <PackageReference Include="Avalonia.Themes.Fluent" Version="12.1.4" />
              <PackageReference Include="Avalonia.Fonts.Inter" Version="12.1.4" />
              <PackageReference Include="Avalonia.Headless" Version="12.1.4" />
            </ItemGroup>
          </Project>
          PROJECT
          dotnet restore Bootstrap.csproj
          dotnet new install Avalonia.Templates
          dotnet --info > "$RUNNER_TEMP/inking-toolchain-info.txt"
          printf '\nAvalonia: 12.1.4\n' >> "$RUNNER_TEMP/inking-toolchain-info.txt"
      - name: Bundle isolated toolchain for offline local validation
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$DOTNET_INSTALL_DIR" -czf "$RUNNER_TEMP/inking-dotnet.tar.gz" .
          tar -C "$NUGET_PACKAGES" -czf "$RUNNER_TEMP/inking-nuget.tar.gz" .
          sha256sum "$RUNNER_TEMP/inking-dotnet.tar.gz" "$RUNNER_TEMP/inking-nuget.tar.gz" > "$RUNNER_TEMP/inking-toolchain-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: inking-dotnet-toolchain
          path: ${{ runner.temp }}/inking-dotnet.tar.gz
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: inking-nuget-cache
          path: |
            ${{ runner.temp }}/inking-nuget.tar.gz
            ${{ runner.temp }}/inking-toolchain-info.txt
            ${{ runner.temp }}/inking-toolchain-sha256.txt
          compression-level: 0
          retention-days: 1
