name: Inking development toolchain
on:
  push:
    branches: [feat/standalone-inking-system]
    paths: [.github/workflows/inking-bootstrap.yml]
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inking-dotnet-toolchain
          run-id: 38603124711
          github-token: ${{ github.token }}
          path: /tmp/inking-source
      - uses: actions/download-artifact@v4
        with:
          name: inking-nuget-cache
          run-id: 38603124711
          github-token: ${{ github.token }}
          path: /tmp/inking-source
      - name: Partition existing archives without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/inking-source
          split -b 400m inking-dotnet.tar.gz inking-dotnet.part-
          split -b 400m inking-nuget.tar.gz inking-nuget.part-
          sha256sum inking-dotnet.tar.gz inking-nuget.tar.gz inking-*.part-* > transfer-sha256.txt
          test ! -e inking-dotnet.part-ac
          test ! -e inking-nuget.part-ac
      - uses: actions/upload-artifact@v4
        with:
          name: inking-dotnet-part-1
          path: /tmp/inking-source/inking-dotnet.part-aa
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: inking-dotnet-part-2
          path: /tmp/inking-source/inking-dotnet.part-ab
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: inking-nuget-part-1
          path: /tmp/inking-source/inking-nuget.part-aa
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: inking-nuget-part-2
          path: |
            /tmp/inking-source/inking-nuget.part-ab
            /tmp/inking-source/inking-toolchain-info.txt
            /tmp/inking-source/transfer-sha256.txt
          compression-level: 0
          retention-days: 1
