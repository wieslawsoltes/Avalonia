name: FerroUI offline validation toolchain
on:
  push:
    branches: ['perf/ferroui-runtime-optimizations']
    paths: ['.github/workflows/ferroui-dev-toolchain.yml']
permissions:
  contents: read
jobs:
  package:
    if: github.repository == 'wieslawsoltes/Avalonia'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Restore public validation dependencies
        run: |
          for project in Avalonia.Base.UnitTests Avalonia.Controls.UnitTests Avalonia.Markup.UnitTests Avalonia.Markup.Xaml.UnitTests Avalonia.Skia.UnitTests Avalonia.Themes.UnitTests Avalonia.Benchmarks; do
            dotnet restore "tests/$project/$project.csproj" -p:AvsSkipBuildingLegacyTargetFrameworks=True
          done
      - name: Package SDK and restored public packages without machine configuration
        shell: bash
        run: |
          set -euo pipefail
          paths=(dotnet host "sdk/$(dotnet --version)" packs shared/Microsoft.NETCore.App shared/Microsoft.AspNetCore.App)
          for optional in sdk-manifests metadata; do
            if [ -d "$DOTNET_ROOT/$optional" ]; then paths+=("$optional"); fi
          done
          tar -I 'gzip -1' -cf "$RUNNER_TEMP/ferroui-dotnet.tar.gz" -C "$DOTNET_ROOT" "${paths[@]}"
          tar -I 'gzip -1' -cf "$RUNNER_TEMP/ferroui-nuget.tar.gz" -C "$HOME/.nuget" packages
          sha256sum "$RUNNER_TEMP/ferroui-dotnet.tar.gz" "$RUNNER_TEMP/ferroui-nuget.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: ferroui-dotnet-toolchain
          path: ${{ runner.temp }}/ferroui-dotnet.tar.gz
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: ferroui-restored-public-packages
          path: ${{ runner.temp }}/ferroui-nuget.tar.gz
          compression-level: 0
          retention-days: 1
