name: Standalone Inking
on:
  push:
    branches: [feat/standalone-inking-system]
    paths: ['standalone/Avalonia.Inking/**', '.github/workflows/inking.yml']
  pull_request:
    paths: ['standalone/Avalonia.Inking/**', '.github/workflows/inking.yml']
permissions:
  contents: read
concurrency:
  group: inking-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: standalone/Avalonia.Inking
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: standalone/Avalonia.Inking
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - name: Validate independent ink engine
        run: |
          set -euo pipefail
          mkdir -p artifacts/validation
          dotnet run --project tests/Avalonia.Inking.Specs -c Release -- artifacts/validation/core.json | tee artifacts/validation/core.log
      - name: Compile controls and desktop sample
        run: |
          set -euo pipefail
          dotnet build samples/InkingStudio.Desktop -c Release > artifacts/validation/desktop-build.log 2>&1 || { cat artifacts/validation/desktop-build.log; exit 1; }
          tail -n 12 artifacts/validation/desktop-build.log
      - name: Publish actual Avalonia WebAssembly application
        run: |
          set -euo pipefail
          dotnet workload install wasm-tools --skip-manifest-update > artifacts/validation/workload.log 2>&1 || { tail -n 60 artifacts/validation/workload.log; exit 1; }
          dotnet publish samples/InkingStudio.Browser -c Release -o artifacts/browser > artifacts/validation/browser-build.log 2>&1 || { tail -n 16 artifacts/validation/browser-build.log; exit 1; }
          grep -E 'error|warning|InkingStudio.Browser ->' artifacts/validation/browser-build.log || true
      - name: Validate published browser application
        run: |
          set -euo pipefail
          python -m pip install -r validation/requirements.txt > artifacts/validation/browser-setup.log 2>&1 || { cat artifacts/validation/browser-setup.log; exit 1; }
          python -m playwright install chromium --with-deps >> artifacts/validation/browser-setup.log 2>&1 || { tail -n 40 artifacts/validation/browser-setup.log; exit 1; }
          python validation/browser.py | tee artifacts/validation/browser-run.log
      - name: Validate native control lifecycle
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dotnet run --project tests/Avalonia.Inking.HeadlessSpecs -c Release -- artifacts/validation/headless.json | tee artifacts/validation/headless.log
      - name: Pack reusable libraries and validate isolated consumer
        run: |
          set -euo pipefail
          mkdir -p artifacts/packages
          for project in Avalonia.Inking.Core Avalonia.Inking Avalonia.Inking.Themes; do
            dotnet pack "src/$project" -c Release --no-restore -o artifacts/packages
          done
          bash validation/package-consumer.sh | tee artifacts/validation/package-consumer.log
      - name: Package exact source and validation evidence
        if: always()
        run: python validation/package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inking-source
          path: |
            standalone/Avalonia.Inking/artifacts/distribution/Avalonia.Inking-source.zip
            standalone/Avalonia.Inking/artifacts/distribution/manifest.json
            standalone/Avalonia.Inking/artifacts/distribution/SHA256SUMS.txt
            standalone/Avalonia.Inking/artifacts/distribution/final-archive-verification.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inking-browser
          path: standalone/Avalonia.Inking/artifacts/distribution/Avalonia.Inking-browser.zip
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inking-packages
          path: standalone/Avalonia.Inking/artifacts/distribution/Avalonia.Inking-packages.zip
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inking-validation
          path: standalone/Avalonia.Inking/artifacts/distribution/Avalonia.Inking-validation.zip
          retention-days: 30
