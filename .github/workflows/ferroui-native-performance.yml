name: FerroUI native measurements
on:
  push:
    branches: ['perf/ferroui-runtime-optimizations']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ferroui-native-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  compare:
    if: github.repository == 'wieslawsoltes/Avalonia'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        runtime-mode: [optimized-jit, runtime-default]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Test measurement validation
        run: python3 -m unittest discover -s scripts/performance -p 'test_*.py' -v
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Calibrate same-revision variation
        env:
          RUNTIME_MODE: ${{ matrix.runtime-mode }}
        run: python3 scripts/performance/compare-native.py --pairs 5 --calibrate --runtime-mode "$RUNTIME_MODE" --output "$RUNNER_TEMP/ferroui-calibration"
      - name: Alternate exact baseline and branch measurements
        env:
          RUNTIME_MODE: ${{ matrix.runtime-mode }}
        run: python3 scripts/performance/compare-native.py --pairs 5 --runtime-mode "$RUNTIME_MODE" --calibration-file "$RUNNER_TEMP/ferroui-calibration/comparison.json" --output "$RUNNER_TEMP/ferroui-native"
      - name: Publish comparison summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ferroui-native/comparison.md" ]; then
            cat "$RUNNER_TEMP/ferroui-native/comparison.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ferroui-native-${{ matrix.os }}-${{ matrix.runtime-mode }}
          path: |
            ${{ runner.temp }}/ferroui-native
            ${{ runner.temp }}/ferroui-calibration
          retention-days: 14
