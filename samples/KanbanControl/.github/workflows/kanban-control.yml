name: Kanban control validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: kanban-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core specifications
        run: |
          set -o pipefail
          mkdir -p artifacts
          dotnet run --project tests/Kanban.Core.Tests -c Release | tee artifacts/core.log
      - name: Headless template, selection and virtualization checks
        id: headless
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet run --project tests/Kanban.Headless.Tests -c Release | tee artifacts/headless.log
      - name: Build desktop sample
        id: desktop
        continue-on-error: true
        run: dotnet build samples/Kanban.Sample.Desktop -c Release
      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools
      - name: Publish real Avalonia browser application
        id: browser_build
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet publish samples/Kanban.Sample.Browser -c Release -o artifacts/browser | tee artifacts/browser-build.log
          find artifacts/browser -name index.html -print
      - name: Browser interaction validation
        id: browser_test
        if: steps.browser_build.outcome == 'success'
        continue-on-error: true
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          SITE=$(find artifacts/browser -name index.html -printf '%h\n' | head -1)
          test -n "$SITE"
          python scripts/serve.py "$SITE" --port 8080 >artifacts/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python tests/browser/validate.py --url http://127.0.0.1:8080 --output artifacts/validation
      - name: Pack libraries
        run: |
          dotnet pack src/Kanban.Core -c Release -o artifacts/packages
          dotnet pack src/Kanban.Avalonia -c Release -o artifacts/packages
      - name: Capture exact build source
        if: always()
        run: |
          git rev-parse HEAD > artifacts/commit.txt
          git archive HEAD > artifacts/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kanban-validation-${{ github.sha }}
          path: artifacts
          retention-days: 14
      - name: Require all validation stages to pass
        if: always()
        env:
          HEADLESS: ${{ steps.headless.outcome }}
          DESKTOP: ${{ steps.desktop.outcome }}
          BROWSER_BUILD: ${{ steps.browser_build.outcome }}
          BROWSER_TEST: ${{ steps.browser_test.outcome }}
        run: |
          test "$HEADLESS" = success
          test "$DESKTOP" = success
          test "$BROWSER_BUILD" = success
          test "$BROWSER_TEST" = success
